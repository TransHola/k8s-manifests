apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emqx-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx
  labels:
    app: emqx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emqx
  template:
    metadata:
      labels:
        app: emqx
    spec:
      containers:
      - name: emqx
        image: emqx/emqx:5.0.26
        ports:
        - containerPort: 1883
        - containerPort: 8083
        - containerPort: 18083
        volumeMounts:
        - name: emqx-data
          mountPath: /opt/emqx/data
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: emqx-data
        persistentVolumeClaim:
          claimName: emqx-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: emqx
spec:
  selector:
    app: emqx
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
  - name: ws
    port: 8083
    targetPort: 8083
  - name: dashboard
    port: 18083
    targetPort: 18083
