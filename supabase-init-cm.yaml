    -- Real-World License Plate Formats & Styles for Transhola Platform
    -- Countries: United States (US), Spain (ES), United Arab Emirates (AE), Morocco (MA)
    -- Concentrating on commercial vehicle types: Executive Sedans, Luxury SUVs, Chauffeur Vans, Minibuses

    DO $$
    DECLARE
        v_us_id UUID;
        v_es_id UUID;
        v_ae_id UUID;
        v_ma_id UUID;

        r_id UUID;
        c_id UUID;
        row_id UUID;
        row_id2 UUID;
        s_id UUID;
        
        r_rec RECORD;
    BEGIN
        SELECT id INTO v_us_id FROM public.country_configurations WHERE country_code = 'US';
        SELECT id INTO v_es_id FROM public.country_configurations WHERE country_code = 'ES';
        SELECT id INTO v_ae_id FROM public.country_configurations WHERE country_code = 'AE';
        SELECT id INTO v_ma_id FROM public.country_configurations WHERE country_code = 'MA';

        -- Clean existing plate definitions to reseed cleanly
        DELETE FROM public.country_license_plate_regions 
        WHERE country_config_id IN (v_us_id, v_es_id, v_ae_id, v_ma_id);

        --------------------------------------------------------------------------------
        -- 1. SPAIN (ES)
        -- Format: 0000 · BBB (4 digits + 3 consonants, vowels excluded)
        -- Categories: 
        --  1) VTC - Chauffeur & Private Hire (Blue Rear Plate #1E3A8A)
        --  2) Autobús / Autocar (Servicio Público - SP) (White Plate #FFFFFF + SP Badge)
        --------------------------------------------------------------------------------
        IF v_es_id IS NOT NULL THEN
            FOR r_rec IN 
                SELECT * FROM (
                    VALUES 
                        ('Comunidad de Madrid', 'MD', 1),
                        ('Cataluña', 'CT', 2),
                        ('Andalucía', 'AN', 3),
                        ('Illes Balears', 'IB', 4)
                ) AS t(region_name, abbreviation, display_order)
            LOOP
                INSERT INTO public.country_license_plate_regions (country_config_id, region_name, abbreviation, display_order)
                VALUES (v_es_id, r_rec.region_name, r_rec.abbreviation, r_rec.display_order)
                RETURNING id INTO r_id;

                -- 1. VTC Category (Blue Plate)
                INSERT INTO public.country_license_plate_categories (
                    plate_region_id, type, localized_type, has_color, color, color_name, has_abbreviation, abbreviation, bilingual
                ) VALUES (
                    r_id, 'VTC - Chauffeur & Private Hire', 'Vehículo de Turismo con Conductor (VTC)', true, '#1E3A8A', 'VTC Blue', true, 'VTC', false
                ) RETURNING id INTO c_id;

                INSERT INTO public.country_license_plate_rows (plate_category_id, apply_color) VALUES (c_id, true) RETURNING id INTO row_id;
                
                -- Slot 1: Euroband 'E'
                INSERT INTO public.country_license_plate_slots (plate_row_id, position, apply_color) VALUES (row_id, 'Left', false) RETURNING id INTO s_id;
                INSERT INTO public.country_license_plate_lines (plate_slot_id, field_type, placeholder, max_char, exact_match, font_size, is_bold)
                VALUES (s_id, 'Letters', 'E', '1', true, '26', true);

                -- Slot 2: 4 Digits Format '0000'
                INSERT INTO public.country_license_plate_slots (plate_row_id, position, apply_color) VALUES (row_id, 'Center', false) RETURNING id INTO s_id;
                INSERT INTO public.country_license_plate_lines (plate_slot_id, field_type, placeholder, max_char, exact_match, font_size, is_bold)
                VALUES (s_id, 'Number', '0000', '4', false, '42', true);

                -- Slot 3: 3 Consonants Format 'BBB'
                INSERT INTO public.country_license_plate_slots (plate_row_id, position, apply_color) VALUES (row_id, 'Right', false) RETURNING id INTO s_id;
                INSERT INTO public.country_license_plate_lines (plate_slot_id, field_type, placeholder, max_char, exact_match, font_size, is_bold)
                VALUES (s_id, 'Letters', 'BBB', '3', false, '42', true);


                -- 2. Autobús / Autocar (SP - Servicio Público) Category (White Plate + SP Badge)
                INSERT INTO public.country_license_plate_categories (
                    plate_region_id, type, localized_type, has_color, color, color_name, has_abbreviation, abbreviation, bilingual
                ) VALUES (
                    r_id, 'Autobús / Autocar (SP Bus)', 'Transporte de Viajeros en Autobús (Servicio Público)', false, '#FFFFFF', 'Standard White', true, 'SP', false
                ) RETURNING id INTO c_id;

                INSERT INTO public.country_license_plate_rows (plate_category_id, apply_color) VALUES (c_id, false) RETURNING id INTO row_id;
                
                -- Slot 1: Euroband 'E'
                INSERT INTO public.country_license_plate_slots (plate_row_id, position, apply_color) VALUES (row_id, 'Left', false) RETURNING id INTO s_id;
                INSERT INTO public.country_license_plate_lines (plate_slot_id, field_type, placeholder, max_char, exact_match, font_size, is_bold)
                VALUES (s_id, 'Letters', 'E', '1', true, '26', true);

                -- Slot 2: 4 Digits Format '0000'
                INSERT INTO public.country_license_plate_slots (plate_row_id, position, apply_color) VALUES (row_id, 'Center', false) RETURNING id INTO s_id;
                INSERT INTO public.country_license_plate_lines (plate_slot_id, field_type, placeholder, max_char, exact_match, font_size, is_bold)
                VALUES (s_id, 'Number', '0000', '4', false, '42', true);

                -- Slot 3: 3 Consonants Format 'BBB'
                INSERT INTO public.country_license_plate_slots (plate_row_id, position, apply_color) VALUES (row_id, 'Right', false) RETURNING id INTO s_id;
                INSERT INTO public.country_license_plate_lines (plate_slot_id, field_type, placeholder, max_char, exact_match, font_size, is_bold)
                VALUES (s_id, 'Letters', 'BBB', '3', false, '42', true);
            END LOOP;
        END IF;

