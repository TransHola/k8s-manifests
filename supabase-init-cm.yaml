    -- Universal audit trail trigger function
    CREATE OR REPLACE FUNCTION public.proc_universal_audit_trail()
    RETURNS TRIGGER AS $$
    DECLARE
        v_actor TEXT;
        v_actor_name TEXT;
        v_user_id UUID;
        v_action TEXT;
        v_entity_id TEXT;
        v_diff JSONB;
        v_changes JSONB := '{}'::jsonb;
        v_country TEXT := 'Global';
        v_company_id UUID := NULL;
        v_summary TEXT;
        v_ip_address TEXT := NULL;
        v_old_json JSONB;
        v_new_json JSONB;
        v_key TEXT;
        v_old_val JSONB;
        v_new_val JSONB;
        v_identifier TEXT := NULL;
        v_version INT := 1;
        v_lifecycle TEXT := 'created';
        v_is_ai BOOLEAN := false;
        v_ai_agent TEXT := NULL;
        v_delegated_by TEXT := NULL;
    BEGIN
        IF TG_TABLE_NAME = 'audit_logs' THEN
            RETURN NULL;
        END IF;

        BEGIN
            v_user_id := auth.uid();
            v_actor := COALESCE(
                auth.jwt()->>'email',
                auth.jwt()->>'role',
                current_setting('request.jwt.claim.email', true),
                'System Operator'
            );
        EXCEPTION WHEN OTHERS THEN
            v_user_id := NULL;
            v_actor := 'System Process';
        END;

        IF v_actor IS NULL OR v_actor = '' THEN
            v_actor := 'System Automation';
        END IF;

        IF v_actor LIKE '%admin@transhola.com%' OR v_user_id IN ('2557bace-be05-466c-a68a-2b6190fd6389'::uuid, '00000000-0000-0000-0000-000000000000'::uuid) THEN
            v_actor := 'Fathallah Lahlou';
        END IF;

        BEGIN
            v_is_ai := (
                COALESCE(current_setting('app.is_ai', true), 'false') = 'true' OR
                (current_setting('request.headers', true)::json->>'x-executed-by' = 'ai') OR
                (current_setting('request.headers', true)::json->>'x-ai-agent' IS NOT NULL) OR
                (auth.jwt()->>'is_ai' = 'true')
            );

            IF v_is_ai THEN
                v_ai_agent := COALESCE(
                    current_setting('app.ai_agent', true),
                    current_setting('request.headers', true)::json->>'x-ai-agent',
                    'Antigravity AI'
                );
                v_delegated_by := COALESCE(
                    current_setting('app.delegated_by', true),
                    current_setting('request.headers', true)::json->>'x-delegated-by',
                    'Fathallah Lahlou'
                );
                v_actor_name := v_delegated_by || ' (AI Assistant)';
            ELSE
                v_actor_name := v_actor;
            END IF;
        EXCEPTION WHEN OTHERS THEN
            v_is_ai := false;
            v_ai_agent := NULL;
            v_delegated_by := NULL;
            v_actor_name := v_actor;
        END;

        BEGIN
            v_ip_address := current_setting('request.headers', true)::json->>'x-forwarded-for';
            IF v_ip_address IS NULL THEN
                v_ip_address := current_setting('request.headers', true)::json->>'x-real-ip';
            END IF;
        EXCEPTION WHEN OTHERS THEN
            v_ip_address := NULL;
        END;

        IF (TG_OP = 'INSERT') THEN
            v_lifecycle := 'created';
            v_new_json := to_jsonb(NEW);
            v_action := TG_TABLE_NAME || '.CREATED';
            v_entity_id := COALESCE(NEW.id::text, 'unknown');
            
            v_identifier := COALESCE(
                v_new_json->>'plate_number',
                v_new_json->>'name',
                v_new_json->>'title',
                v_new_json->>'code',
                v_new_json->>'email',
                SUBSTRING(v_entity_id, 1, 8)
            );

            v_summary := 'Created ' || TG_TABLE_NAME || ' (' || v_identifier || ')';
            v_diff := jsonb_build_object('new', v_new_json);

            v_country := COALESCE(
                v_new_json->>'country',
                v_new_json->>'country_code',
                'Global'
            );

            IF TG_TABLE_NAME = 'company_profiles' THEN
                v_company_id := NEW.id;
            ELSIF v_new_json ? 'company_id' AND v_new_json->>'company_id' IS NOT NULL THEN
                BEGIN
                    v_company_id := (v_new_json->>'company_id')::uuid;
                EXCEPTION WHEN OTHERS THEN
                    v_company_id := NULL;
                END;
            END IF;

        ELSIF (TG_OP = 'UPDATE') THEN
            v_lifecycle := 'updated';
            v_old_json := to_jsonb(OLD);
            v_new_json := to_jsonb(NEW);
            v_action := TG_TABLE_NAME || '.UPDATED';
            v_entity_id := COALESCE(NEW.id::text, OLD.id::text, 'unknown');

            v_identifier := COALESCE(
                v_new_json->>'plate_number',
                v_old_json->>'plate_number',
                v_new_json->>'name',
                v_old_json->>'name',
                v_new_json->>'title',
                v_old_json->>'title',
                SUBSTRING(v_entity_id, 1, 8)
            );

            FOR v_key IN SELECT jsonb_object_keys(v_new_json)
            LOOP
                IF v_key NOT IN ('updated_at', 'created_at') THEN
                    v_old_val := v_old_json -> v_key;
                    v_new_val := v_new_json -> v_key;
                    IF v_old_val IS DISTINCT FROM v_new_val THEN
                        v_changes := jsonb_set(
                            v_changes,
                            ARRAY[v_key],
                            jsonb_build_object('old', v_old_val, 'new', v_new_val)
                        );
                    END IF;
                END IF;
            END LOOP;

            IF v_changes ? 'status' THEN
                v_summary := 'Updated ' || TG_TABLE_NAME || ' (' || v_identifier || '): status changed to ' || COALESCE(v_new_json->>'status', 'unknown');
            ELSIF v_changes ? 'is_active' THEN
                v_summary := 'Updated ' || TG_TABLE_NAME || ' (' || v_identifier || '): active state changed to ' || COALESCE(v_new_json->>'is_active', 'unknown');
            ELSE
                v_summary := 'Updated ' || TG_TABLE_NAME || ' (' || v_identifier || ')';
            END IF;

            v_diff := jsonb_build_object(
                'changes', v_changes,
                'old', v_old_json,
                'new', v_new_json
            );

            v_country := COALESCE(
                v_new_json->>'country',
                v_new_json->>'country_code',
                v_old_json->>'country',
                v_old_json->>'country_code',
                'Global'
            );

            IF TG_TABLE_NAME = 'company_profiles' THEN
                v_company_id := COALESCE(NEW.id, OLD.id);
            ELSIF v_new_json ? 'company_id' AND v_new_json->>'company_id' IS NOT NULL THEN
                BEGIN
                    v_company_id := (v_new_json->>'company_id')::uuid;
                EXCEPTION WHEN OTHERS THEN
                    v_company_id := NULL;
                END;
            ELSIF v_old_json ? 'company_id' AND v_old_json->>'company_id' IS NOT NULL THEN
                BEGIN
                    v_company_id := (v_old_json->>'company_id')::uuid;
                EXCEPTION WHEN OTHERS THEN
                    v_company_id := NULL;
                END;
            END IF;

        ELSIF (TG_OP = 'DELETE') THEN
            v_lifecycle := 'deleted';
            v_old_json := to_jsonb(OLD);
            v_action := TG_TABLE_NAME || '.DELETED';
            v_entity_id := COALESCE(OLD.id::text, 'unknown');
            
            v_identifier := COALESCE(
                v_old_json->>'plate_number',
                v_old_json->>'name',
                v_old_json->>'title',
                SUBSTRING(v_entity_id, 1, 8)
            );

            v_summary := 'Deleted ' || TG_TABLE_NAME || ' (' || v_identifier || ')';
            v_diff := jsonb_build_object('old', v_old_json);

            v_country := COALESCE(
                v_old_json->>'country',
                v_old_json->>'country_code',
                'Global'
            );

            IF TG_TABLE_NAME = 'company_profiles' THEN
                v_company_id := OLD.id;
            ELSIF v_old_json ? 'company_id' AND v_old_json->>'company_id' IS NOT NULL THEN
                BEGIN
                    v_company_id := (v_old_json->>'company_id')::uuid;
                EXCEPTION WHEN OTHERS THEN
                    v_company_id := NULL;
                END;
            END IF;
        END IF;

        BEGIN
            SELECT COALESCE(MAX(version_number), 0) + 1 
            INTO v_version
            FROM public.audit_logs 
            WHERE entity_type = TG_TABLE_NAME AND (entity_id = v_entity_id OR target_id = v_entity_id);
        EXCEPTION WHEN OTHERS THEN
            v_version := 1;
        END;

        INSERT INTO public.audit_logs (
            company_id,
            user_id,
            actor,
            actor_name,
            action,
            detail,
            status,
            country,
            platform,
            entity_type,
            entity_id,
            target_id,
            is_ai,
            ai_agent,
            delegated_by,
            version_number,
            lifecycle_stage,
            metadata,
            details,
            context,
            ip_address,
            created_at
        ) VALUES (
            v_company_id,
            v_user_id,
            v_actor,
            v_actor_name,
            v_action,
            v_summary,
            'success',
            v_country,
            'database-engine',
            TG_TABLE_NAME,
            v_entity_id,
            v_entity_id,
            v_is_ai,
            v_ai_agent,
            v_delegated_by,
            v_version,
            v_lifecycle,
            jsonb_build_object(
                'diff', v_diff,
                'changes', v_changes,
                'is_ai', v_is_ai,
                'ai_agent', v_ai_agent,
                'delegated_by', v_delegated_by,
                'version', v_version,
                'lifecycle_stage', v_lifecycle
            ),
            v_diff,
            jsonb_build_object(
                'ip', COALESCE(v_ip_address, '127.0.0.1'),
                'operation', TG_OP,
                'table', TG_TABLE_NAME,
                'source', 'universal-audit-engine',
                'is_ai', v_is_ai,
                'ai_agent', v_ai_agent,
                'delegated_by', v_delegated_by,
                'version', v_version
            ),
            v_ip_address,
            now()
        );

        IF (TG_OP = 'DELETE') THEN
            RETURN OLD;
        ELSE
            RETURN NEW;
        END IF;
    EXCEPTION WHEN OTHERS THEN
        RAISE WARNING 'Audit trail logging failed on %: %', TG_TABLE_NAME, SQLERRM;
        IF (TG_OP = 'DELETE') THEN
            RETURN OLD;
        ELSE
            RETURN NEW;
        END IF;
    END;
    $$ LANGUAGE plpgsql SECURITY DEFINER;

    -- Attach universal audit trail to all core operational tables
    DO $$
    DECLARE
        t TEXT;
        table_list TEXT[] := ARRAY[
            'bookings', 'booking_legs', 'booking_routes', 'booking_stops',
            'vehicles', 'vehicle_schedules', 'vehicle_specs', 'vehicle_statuses',
            'vehicle_types', 'vehicle_makes', 'vehicle_models',
            'drivers', 'driver_leaves', 'driver_reviews', 'driver_roles',
            'driver_documents', 'driver_history_logs',
            'company_profiles', 'company_operating_countries', 'staff_profiles',
            'garages', 'operational_hubs', 'service_areas',
            'billing_invoices', 'billing_payouts', 'payment_methods',
            'dispatch_assignments', 'dispatch_anomalies', 'operator_notifications',
            'legal_agreements', 'country_configurations', 'country_document_requirements',
            'country_license_plate_regions', 'country_license_plate_categories',
            'country_license_plate_lines', 'country_license_plate_rows', 'country_license_plate_slots',
            'document_types', 'documents', 'global_settings', 'profiles'
        ];
    BEGIN
        FOREACH t IN ARRAY table_list
        LOOP
            IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = t) THEN
                EXECUTE format('DROP TRIGGER IF EXISTS trg_audit_%I ON public.%I;', t, t);
                EXECUTE format('CREATE TRIGGER trg_audit_%I AFTER INSERT OR UPDATE OR DELETE ON public.%I FOR EACH ROW EXECUTE FUNCTION public.proc_universal_audit_trail();', t, t);
            END IF;
        END LOOP;
    END;
    $$;

    GRANT ALL ON ALL TABLES IN SCHEMA public TO postgres, anon, authenticated, service_role;
    GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO postgres, anon, authenticated, service_role;



