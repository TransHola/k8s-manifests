    -- RPC Functions for SuperAdmin
    CREATE OR REPLACE FUNCTION public.admin_get_all_companies()
    RETURNS SETOF public.company_profiles
    LANGUAGE sql
    STABLE
    SECURITY DEFINER
    AS $$
      SELECT * FROM public.company_profiles ORDER BY created_at DESC;
    $$;

    CREATE OR REPLACE FUNCTION public.admin_get_all_vehicles()
    RETURNS SETOF public.vehicles
    LANGUAGE sql
    STABLE
    SECURITY DEFINER
    AS $$
      SELECT * FROM public.vehicles ORDER BY created_at DESC;
    $$;

    GRANT EXECUTE ON FUNCTION public.admin_get_all_companies() TO postgres, anon, authenticated, service_role;
    GRANT EXECUTE ON FUNCTION public.admin_get_all_vehicles() TO postgres, anon, authenticated, service_role;

    -- Drivers and Chauffeur Ecosystem Tables
    CREATE TABLE IF NOT EXISTS public.drivers (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        company_id UUID REFERENCES public.company_profiles(id) ON DELETE CASCADE,
        user_id UUID,
        first_name TEXT NOT NULL,
        last_name TEXT NOT NULL,
        email TEXT,
        phone TEXT,
        license_number TEXT NOT NULL,
        license_state TEXT,
        license_class TEXT,
        license_expiry DATE,
        license_qualifications JSONB DEFAULT '[]'::jsonb,
        hire_date DATE,
        home_base TEXT,
        status TEXT DEFAULT 'active',
        type TEXT DEFAULT 'chauffeur',
        rating NUMERIC DEFAULT 5.0,
        completion_rate NUMERIC DEFAULT 100,
        punctuality NUMERIC DEFAULT 100,
        utilization NUMERIC DEFAULT 0,
        years_experience INT DEFAULT 5,
        created_at TIMESTAMPTZ DEFAULT now(),
        updated_at TIMESTAMPTZ DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS public.driver_documents (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        driver_id UUID REFERENCES public.drivers(id) ON DELETE CASCADE,
        name TEXT NOT NULL,
        document_type TEXT,
        image_url TEXT NOT NULL DEFAULT '',
        expiration_date DATE,
        extracted_data JSONB DEFAULT '{}'::jsonb,
        status TEXT DEFAULT 'approved',
        created_at TIMESTAMPTZ DEFAULT now(),
        updated_at TIMESTAMPTZ DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS public.driver_history_logs (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        driver_id UUID REFERENCES public.drivers(id) ON DELETE CASCADE,
        action TEXT NOT NULL,
        actor_metadata JSONB DEFAULT '{}'::jsonb,
        context_metadata JSONB DEFAULT '{}'::jsonb,
        details_metadata JSONB DEFAULT '{}'::jsonb,
        timestamp TIMESTAMPTZ DEFAULT now(),
        created_at TIMESTAMPTZ DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS public.driver_roles (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        driver_id UUID REFERENCES public.drivers(id) ON DELETE CASCADE,
        name TEXT NOT NULL,
        description TEXT,
        created_at TIMESTAMPTZ DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS public.driver_reviews (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        driver_id UUID REFERENCES public.drivers(id) ON DELETE CASCADE,
        author_name TEXT,
        rating NUMERIC NOT NULL DEFAULT 5.0,
        comment TEXT,
