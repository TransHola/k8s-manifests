    --
    -- Name: find_region_by_coordinate(double precision, double precision, character varying); Type: FUNCTION; Schema: public; Owner: -
    --
    
    CREATE FUNCTION public.find_region_by_coordinate(p_lon double precision, p_lat double precision, p_country_code character varying DEFAULT NULL::character varying) RETURNS TABLE(region_name character varying, level integer, type character varying, region_id uuid)
        LANGUAGE plpgsql
        AS $$
    DECLARE
        v_config_id UUID;
    BEGIN
        IF p_country_code IS NOT NULL THEN
            SELECT id INTO v_config_id FROM public.country_configurations WHERE country_code = p_country_code;
        END IF;
    
        RETURN QUERY
        SELECT cr.name, cr.level, cr.type, cr.id
        FROM public.country_regions cr
        WHERE ST_Contains(cr.geom, ST_SetSRID(ST_Point(p_lon, p_lat), 4326))
          AND (v_config_id IS NULL OR cr.country_config_id = v_config_id)
        ORDER BY cr.level DESC;
    END;
    $$;
    
    
    --
    -- Name: insert_geojson_boundary(character varying, jsonb, jsonb); Type: FUNCTION; Schema: public; Owner: -
    --
    
    CREATE FUNCTION public.insert_geojson_boundary(p_country_code character varying, p_hierarchy_levels jsonb, p_geojson jsonb) RETURNS jsonb
        LANGUAGE plpgsql SECURITY DEFINER
        SET search_path TO ''
        AS $$
    DECLARE
        v_config_id UUID;
        feature JSONB;
        v_geom GEOMETRY;
        r_name_0 VARCHAR;
        r_name_1 VARCHAR;
        r_name_2 VARCHAR;
        r_name_3 VARCHAR;
        v_id_1 UUID;
        v_id_2 UUID;
        v_id_3 UUID;
        inserted_count INTEGER := 0;
    BEGIN
        -- Get country config ID
        SELECT id INTO v_config_id FROM public.country_configurations WHERE country_code = p_country_code;
        IF v_config_id IS NULL THEN
            RETURN jsonb_build_object('success', false, 'error', 'Country config not found');
        END IF;
    
        -- Assume p_geojson is a FeatureCollection
        FOR feature IN SELECT * FROM jsonb_array_elements(p_geojson->'features')
        LOOP
            v_geom := ST_Force2D(ST_SetSRID(ST_GeomFromGeoJSON(feature->>'geometry'), 4326));
            IF ST_GeometryType(v_geom) = 'ST_Polygon' THEN
                v_geom := ST_Multi(v_geom);
            END IF;
    
            r_name_0 := feature->'properties'->>'NAME_0';
            r_name_1 := regexp_replace(feature->'properties'->>'NAME_1', '([a-z])([A-Z])', '\1 \2', 'g');
            r_name_2 := regexp_replace(feature->'properties'->>'NAME_2', '([a-z])([A-Z])', '\1 \2', 'g');
            r_name_3 := regexp_replace(feature->'properties'->>'NAME_3', '([a-z])([A-Z])', '\1 \2', 'g');
    
            -- Level 1
            IF r_name_1 IS NOT NULL THEN
                SELECT id INTO v_id_1 FROM public.country_regions WHERE country_config_id = v_config_id AND name = r_name_1 AND level = 1 LIMIT 1;
                IF v_id_1 IS NULL THEN
                    INSERT INTO public.country_regions (country_config_id, name, level, type, geom)
                    VALUES (v_config_id, r_name_1, 1, COALESCE(p_hierarchy_levels->>0, 'Level 1'), CASE WHEN r_name_2 IS NULL THEN v_geom ELSE NULL END)
                    RETURNING id INTO v_id_1;
                    inserted_count := inserted_count + 1;
                ELSE
                    IF r_name_2 IS NULL THEN
                        UPDATE public.country_regions SET geom = v_geom WHERE id = v_id_1;
                    END IF;
                END IF;
            END IF;
    
            -- Level 2
            IF r_name_2 IS NOT NULL AND v_id_1 IS NOT NULL THEN
                SELECT id INTO v_id_2 FROM public.country_regions WHERE parent_id = v_id_1 AND name = r_name_2 AND level = 2 LIMIT 1;
                IF v_id_2 IS NULL THEN
                    INSERT INTO public.country_regions (country_config_id, parent_id, name, level, type, geom)
                    VALUES (v_config_id, v_id_1, r_name_2, 2, COALESCE(p_hierarchy_levels->>1, 'Level 2'), CASE WHEN r_name_3 IS NULL THEN v_geom ELSE NULL END)
                    RETURNING id INTO v_id_2;
                    inserted_count := inserted_count + 1;
                ELSE
                    IF r_name_3 IS NULL THEN
                        UPDATE public.country_regions SET geom = v_geom WHERE id = v_id_2;
                    END IF;
                END IF;
            END IF;
    
            -- Level 3
            IF r_name_3 IS NOT NULL AND v_id_2 IS NOT NULL THEN
                SELECT id INTO v_id_3 FROM public.country_regions WHERE parent_id = v_id_2 AND name = r_name_3 AND level = 3 LIMIT 1;
                IF v_id_3 IS NULL THEN
                    INSERT INTO public.country_regions (country_config_id, parent_id, name, level, type, geom)
                    VALUES (v_config_id, v_id_2, r_name_3, 3, COALESCE(p_hierarchy_levels->>2, 'Level 3'), v_geom)
                    RETURNING id INTO v_id_3;
                    inserted_count := inserted_count + 1;
                ELSE
                    UPDATE public.country_regions SET geom = v_geom WHERE id = v_id_3;
                END IF;
            END IF;
        END LOOP;
    
        -- Compute missing parent geometries using ST_Union
        UPDATE public.country_regions parent
        SET geom = (
            SELECT ST_Multi(ST_Union(child.geom))
            FROM public.country_regions child
            WHERE child.parent_id = parent.id
        )
        WHERE parent.country_config_id = v_config_id
          AND parent.geom IS NULL;
    
        -- Repeat once more for Level 1 if it relied on Level 2 which was just updated
        UPDATE public.country_regions parent
        SET geom = (
            SELECT ST_Multi(ST_Union(child.geom))
            FROM public.country_regions child
            WHERE child.parent_id = parent.id
        )
        WHERE parent.country_config_id = v_config_id
          AND parent.geom IS NULL;
    
        RETURN jsonb_build_object('success', true, 'inserted_features', inserted_count);
    EXCEPTION
        WHEN OTHERS THEN
            RETURN jsonb_build_object('success', false, 'error', SQLERRM);
    END;
    $$;
    
    
