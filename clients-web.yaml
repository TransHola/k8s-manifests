apiVersion: apps/v1
kind: Deployment
metadata:
  name: clients-web
  labels:
    app: clients-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clients-web
  template:
    metadata:
      annotations:
        rollout: "2026-09-21-ttl-live-rollout-v1"
      labels:
        app: clients-web
    spec:
      containers:
      - name: clients-web
        image: ttl.sh/transhola-clients-web-2026:24h
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: NODE_OPTIONS
          value: "--max-http-header-size=262144"
        - name: SUPABASE_INTERNAL_URL
          value: "http://supabase-kong:8000"
        - name: NEXT_PUBLIC_SUPABASE_URL
          value: "http://supabase-kong:8000"
        - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
          value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
        - name: SUPABASE_SERVICE_ROLE_KEY
          value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: clients-web-service
spec:
  selector:
    app: clients-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clients-web-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: client.transhola.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: clients-web-service
            port:
              number: 80
