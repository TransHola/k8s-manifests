apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: localhost:5000/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: SUPABASE_SERVICE_ROLE_KEY
          value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
        - name: SUPABASE_URL
          value: "http://supabase-kong:8000"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: KAFKA_BROKERS
          value: "redpanda:9092"
        - name: REDPANDA_BROKERS
          value: "redpanda:9092"
        - name: MQTT_BROKER_URL
          value: "tcp://emqx:1883"
        - name: GIS_SERVICE_URL
          value: "http://gis-engine:4000"
        - name: BOOKING_SERVICE_URL
          value: "http://booking-engine:8000"
        - name: FLEET_SERVICE_URL
          value: "http://dispatch-engine:4030"
        - name: ADMIN_SERVICE_URL
          value: "http://audit-engine:4010"
        resources:
          requests:
            memory: "128Mi"
          limits:
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8000
    targetPort: 8000
