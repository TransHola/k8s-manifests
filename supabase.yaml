apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: supabase-db-pvc-v4
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-db
  namespace: default
  labels:
    app: supabase-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase-db
  template:
    metadata:
      annotations:
        rollout: "v6-auth-schema-and-credentials-2026"
      labels:
        app: supabase-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_DB
          value: "postgres"
        ports:
        - containerPort: 5432
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  (until pg_isready -h localhost -p 5432 -U postgres -d postgres; do sleep 1; done
                  psql -h localhost -p 5432 -U postgres -d postgres -c "
                    ALTER TABLE public.company_profiles ADD COLUMN IF NOT EXISTS risk_level VARCHAR(255) DEFAULT 'Unknown';
                    ALTER TABLE public.company_profiles ADD COLUMN IF NOT EXISTS risk_factors JSONB DEFAULT '[]'::jsonb;
                    ALTER TABLE public.profiles ADD COLUMN IF NOT EXISTS first_name text;
                    ALTER TABLE public.profiles ADD COLUMN IF NOT EXISTS last_name text;
                    ALTER TABLE public.profiles ADD COLUMN IF NOT EXISTS phone_number text;
                    ALTER TABLE public.profiles ADD COLUMN IF NOT EXISTS preferences JSONB DEFAULT '{}'::jsonb;
                    CREATE TABLE IF NOT EXISTS public.sms_otps (
                      id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                      phone_number text NOT NULL,
                      otp_hash text NOT NULL,
                      expires_at timestamptz NOT NULL,
                      created_at timestamptz DEFAULT now()
                    );
                    GRANT ALL ON TABLE public.sms_otps TO postgres, anon, authenticated, service_role;

                    DROP FUNCTION IF EXISTS public.admin_get_all_companies() CASCADE;
                    CREATE OR REPLACE FUNCTION public.admin_get_all_companies()
                    RETURNS SETOF public.company_profiles
                    LANGUAGE sql STABLE SECURITY DEFINER
                    AS \$\$ SELECT * FROM public.company_profiles ORDER BY created_at DESC; \$\$;

                    DROP FUNCTION IF EXISTS public.admin_get_all_vehicles() CASCADE;
                    CREATE OR REPLACE FUNCTION public.admin_get_all_vehicles()
                    RETURNS SETOF public.vehicles
                    LANGUAGE sql STABLE SECURITY DEFINER
                    AS \$\$ SELECT * FROM public.vehicles ORDER BY created_at DESC; \$\$;

                    GRANT USAGE ON SCHEMA public TO postgres, anon, authenticated, service_role;
                    GRANT ALL ON ALL TABLES IN SCHEMA public TO postgres, anon, authenticated, service_role;
                    GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO postgres, anon, authenticated, service_role;
                    GRANT EXECUTE ON FUNCTION public.admin_get_all_companies() TO postgres, anon, authenticated, service_role;
                    GRANT EXECUTE ON FUNCTION public.admin_get_all_vehicles() TO postgres, anon, authenticated, service_role;

                    -- Ensure auth schema and auth.users exist
                    CREATE SCHEMA IF NOT EXISTS auth;
                    CREATE TABLE IF NOT EXISTS auth.users (
                      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                      instance_id UUID,
                      email VARCHAR(255) UNIQUE,
                      encrypted_password VARCHAR(255),
                      email_confirmed_at TIMESTAMPTZ,
                      invited_at TIMESTAMPTZ,
                      confirmation_token VARCHAR(255),
                      confirmation_sent_at TIMESTAMPTZ,
                      recovery_token VARCHAR(255),
                      recovery_sent_at TIMESTAMPTZ,
                      email_change_token_new VARCHAR(255),
                      email_change VARCHAR(255),
                      email_change_sent_at TIMESTAMPTZ,
                      last_sign_in_at TIMESTAMPTZ,
                      raw_app_meta_data JSONB DEFAULT '{}'::jsonb,
                      raw_user_meta_data JSONB DEFAULT '{}'::jsonb,
                      is_super_admin BOOLEAN DEFAULT false,
                      created_at TIMESTAMPTZ DEFAULT NOW(),
                      updated_at TIMESTAMPTZ DEFAULT NOW(),
                      phone VARCHAR(255),
                      phone_confirmed_at TIMESTAMPTZ,
                      phone_change VARCHAR(255),
                      phone_change_token VARCHAR(255),
                      phone_change_sent_at TIMESTAMPTZ,
                      confirmed_at TIMESTAMPTZ,
                      email_change_token_current VARCHAR(255),
                      email_change_confirm_status SMALLINT,
                      banned_until TIMESTAMPTZ,
                      reauthentication_token VARCHAR(255),
                      reauthentication_sent_at TIMESTAMPTZ,
                      is_sso_user BOOLEAN DEFAULT false,
                      deleted_at TIMESTAMPTZ,
                      role VARCHAR(255) DEFAULT 'authenticated',
                      aud VARCHAR(255) DEFAULT 'authenticated'
                    );

                    -- Synchronize SuperAdmin Root Master Credentials (TransHola2026!)
                    UPDATE auth.users 
                    SET encrypted_password = '$2a$10$26HuDSQaI.ArAWnZsJ3pnONhJYQEuCWYyBqGZEFmw9Eidq27lOdrC',
                        email_confirmed_at = COALESCE(email_confirmed_at, NOW()),
                        updated_at = NOW()
                    WHERE email = 'admin@transhola.com';

                    INSERT INTO auth.users (
                      id, instance_id, email, encrypted_password, email_confirmed_at, 
                      raw_app_meta_data, raw_user_meta_data, created_at, updated_at, role, aud
                    )
                    SELECT 
                      '2557bace-be05-466c-a68a-2b6190fd6389', '00000000-0000-0000-0000-000000000000',
                      'admin@transhola.com', '$2a$10$26HuDSQaI.ArAWnZsJ3pnONhJYQEuCWYyBqGZEFmw9Eidq27lOdrC',
                      NOW(), '{"provider":"email","providers":["email"]}', 
                      '{"role":"super_admin","full_name":"Fathallah Lahlou"}', 
                      NOW(), NOW(), 'authenticated', 'authenticated'
                    WHERE NOT EXISTS (SELECT 1 FROM auth.users WHERE email = 'admin@transhola.com');

                    INSERT INTO public.profiles (id, email, full_name, role, status)
                    VALUES ('2557bace-be05-466c-a68a-2b6190fd6389', 'admin@transhola.com', 'Fathallah Lahlou', 'superadmin', 'Active')
                    ON CONFLICT (id) DO UPDATE SET role = 'superadmin', status = 'Active';

                    INSERT INTO public.staff_profiles (id, email, full_name, role, status)
                    VALUES ('2557bace-be05-466c-a68a-2b6190fd6389', 'admin@transhola.com', 'TransHola SuperAdmin', 'owner', 'active')
                    ON CONFLICT (id) DO UPDATE SET role = 'owner', status = 'active';

                    CREATE OR REPLACE FUNCTION public.register_client_account(
                      p_email text,
                      p_password text,
                      p_first_name text DEFAULT NULL,
                      p_last_name text DEFAULT NULL,
                      p_phone text DEFAULT NULL,
                      p_company_name text DEFAULT NULL,
                      p_is_company boolean DEFAULT false
                    )
                    RETURNS jsonb
                    LANGUAGE plpgsql
                    SECURITY DEFINER
                    SET search_path TO public, auth, extensions
                    AS \$\$
                    DECLARE
                      v_norm_email text;
                      v_existing_id uuid;
                      v_new_id uuid;
                      v_full_name text;
                      v_meta jsonb;
                      v_prefs jsonb;
                    BEGIN
                      v_norm_email := LOWER(TRIM(COALESCE(p_email, '')));
                      IF v_norm_email = '' OR POSITION('@' IN v_norm_email) = 0 THEN
                        RETURN jsonb_build_object('error', 'Valid email address is required.');
                      END IF;
                      IF LENGTH(COALESCE(p_password, '')) < 6 THEN
                        RETURN jsonb_build_object('error', 'Password must be at least 6 characters.');
                      END IF;
                      SELECT id INTO v_existing_id FROM auth.users WHERE LOWER(TRIM(email)) = v_norm_email LIMIT 1;
                      IF v_existing_id IS NOT NULL THEN
                        RETURN jsonb_build_object('error', 'This email is already registered. Please sign in.');
                      END IF;
                      v_new_id := gen_random_uuid();
                      v_full_name := TRIM(CONCAT_WS(' ', NULLIF(TRIM(p_first_name), ''), NULLIF(TRIM(p_last_name), '')));
                      IF v_full_name = '' THEN
                        v_full_name := COALESCE(NULLIF(TRIM(p_company_name), ''), SPLIT_PART(v_norm_email, '@', 1));
                      END IF;
                      v_meta := jsonb_build_object(
                        'first_name', COALESCE(NULLIF(TRIM(p_first_name), ''), SPLIT_PART(v_full_name, ' ', 1)),
                        'last_name', COALESCE(NULLIF(TRIM(p_last_name), ''), ''),
                        'full_name', v_full_name,
                        'phone', COALESCE(NULLIF(TRIM(p_phone), ''), ''),
                        'company_name', COALESCE(NULLIF(TRIM(p_company_name), ''), ''),
                        'is_company', COALESCE(p_is_company, false),
                        'role', 'client'
                      );
                      v_prefs := jsonb_build_object(
                        'clientType', CASE WHEN COALESCE(p_is_company, false) THEN 'Corporate' ELSE 'Individual' END,
                        'companyName', NULLIF(TRIM(p_company_name), ''),
                        'firstName', NULLIF(TRIM(p_first_name), ''),
                        'lastName', NULLIF(TRIM(p_last_name), '')
                      );
                      INSERT INTO auth.users (
                        id, instance_id, email, encrypted_password, email_confirmed_at, confirmed_at,
                        raw_app_meta_data, raw_user_meta_data, phone, created_at, updated_at, role, aud
                      ) VALUES (
                        v_new_id, '00000000-0000-0000-0000-000000000000', v_norm_email,
                        crypt(p_password, gen_salt('bf')), NOW(), NOW(),
                        '{"provider":"email","providers":["email"]}'::jsonb,
                        v_meta, NULLIF(TRIM(p_phone), ''), NOW(), NOW(), 'authenticated', 'authenticated'
                      );
                      INSERT INTO public.profiles (
                        id, user_id, email, full_name, phone, phone_number, role, status, preferences, created_at, updated_at
                      ) VALUES (
                        v_new_id, v_new_id, v_norm_email,
                        COALESCE(NULLIF(TRIM(p_company_name), ''), v_full_name),
                        NULLIF(TRIM(p_phone), ''), NULLIF(TRIM(p_phone), ''),
                        'client', 'Active', v_prefs, NOW(), NOW()
                      )
                      ON CONFLICT (id) DO UPDATE SET
                        email = EXCLUDED.email,
                        full_name = EXCLUDED.full_name,
                        role = 'client',
                        status = 'Active',
                        preferences = public.profiles.preferences || EXCLUDED.preferences,
                        updated_at = NOW();
                      RETURN jsonb_build_object(
                        'id', v_new_id,
                        'email', v_norm_email,
                        'user_metadata', v_meta,
                        'app_metadata', '{"provider":"email","providers":["email"]}'::jsonb,
                        'role', 'authenticated',
                        'aud', 'authenticated'
                      );
                    END;
                    \$\$;
                    GRANT EXECUTE ON FUNCTION public.register_client_account(text, text, text, text, text, text, boolean) TO postgres, anon, authenticated, service_role;

                    CREATE OR REPLACE FUNCTION public.update_client_password_by_email(
                      p_email text,
                      p_new_password text
                    )
                    RETURNS jsonb
                    LANGUAGE plpgsql
                    SECURITY DEFINER
                    SET search_path TO public, auth, extensions
                    AS \$\$
                    DECLARE
                      v_norm_email text;
                      v_user record;
                    BEGIN
                      v_norm_email := LOWER(TRIM(COALESCE(p_email, '')));
                      IF v_norm_email = '' OR POSITION('@' IN v_norm_email) = 0 THEN
                        RETURN jsonb_build_object('error', 'Valid email address is required.');
                      END IF;
                      IF LENGTH(COALESCE(p_new_password, '')) < 8 THEN
                        RETURN jsonb_build_object('error', 'Password must be at least 8 characters.');
                      END IF;
                      SELECT id, email, raw_user_meta_data, raw_app_meta_data
                        INTO v_user
                        FROM auth.users
                       WHERE LOWER(TRIM(email)) = v_norm_email
                       LIMIT 1;
                      IF v_user.id IS NULL THEN
                        RETURN jsonb_build_object('error', 'No account found with this email address.');
                      END IF;
                      UPDATE auth.users
                         SET encrypted_password = crypt(p_new_password, gen_salt('bf')),
                             updated_at = NOW()
                       WHERE id = v_user.id;
                      RETURN jsonb_build_object(
                        'id', v_user.id,
                        'email', v_user.email,
                        'user_metadata', COALESCE(v_user.raw_user_meta_data, '{}'::jsonb),
                        'app_metadata', COALESCE(v_user.raw_app_meta_data, '{"provider":"email","providers":["email"]}'::jsonb)
                      );
                    END;
                    \$\$;
                    REVOKE ALL ON FUNCTION public.update_client_password_by_email(text, text) FROM PUBLIC, anon, authenticated;
                    GRANT EXECUTE ON FUNCTION public.update_client_password_by_email(text, text) TO postgres, service_role;

                    CREATE OR REPLACE FUNCTION public.sync_client_auth_metadata(
                      p_user_id uuid,
                      p_meta jsonb
                    )
                    RETURNS boolean
                    LANGUAGE plpgsql
                    SECURITY DEFINER
                    SET search_path TO public, auth, extensions
                    AS \$\$
                    BEGIN
                      UPDATE auth.users
                         SET raw_user_meta_data = COALESCE(raw_user_meta_data, '{}'::jsonb) || COALESCE(p_meta, '{}'::jsonb),
                             phone = COALESCE(NULLIF(TRIM(p_meta->>'phone'), ''), phone),
                             updated_at = NOW()
                       WHERE id = p_user_id;
                      RETURN FOUND;
                    END;
                    \$\$;
                    REVOKE ALL ON FUNCTION public.sync_client_auth_metadata(uuid, jsonb) FROM PUBLIC, anon, authenticated;
                    GRANT EXECUTE ON FUNCTION public.sync_client_auth_metadata(uuid, jsonb) TO postgres, service_role;

                    CREATE OR REPLACE FUNCTION public.provision_corporate_portal_user(
                      p_org_id uuid,
                      p_company_name text,
                      p_email text,
                      p_password text,
                      p_first_name text,
                      p_last_name text,
                      p_phone text,
                      p_corporate_role text,
                      p_permissions jsonb,
                      p_preferences jsonb
                    )
                    RETURNS jsonb
                    LANGUAGE plpgsql
                    SECURITY DEFINER
                    SET search_path TO public, auth, extensions
                    AS \$\$
                    DECLARE
                      v_norm_email text;
                      v_existing_id uuid;
                      v_new_id uuid;
                      v_full_name text;
                      v_meta jsonb;
                      v_prefs jsonb;
                    BEGIN
                      v_norm_email := LOWER(TRIM(COALESCE(p_email, '')));
                      IF v_norm_email = '' OR POSITION('@' IN v_norm_email) = 0 THEN
                        RETURN jsonb_build_object('error', 'Valid work email address is required.');
                      END IF;
                      IF LENGTH(COALESCE(p_password, '')) < 8 THEN
                        RETURN jsonb_build_object('error', 'Initial password must be at least 8 characters.');
                      END IF;
                      SELECT id INTO v_existing_id FROM auth.users WHERE LOWER(TRIM(email)) = v_norm_email LIMIT 1;
                      IF v_existing_id IS NOT NULL THEN
                        RETURN jsonb_build_object('error', 'A portal user with this email already exists.');
                      END IF;

                      v_new_id := gen_random_uuid();
                      v_full_name := TRIM(CONCAT_WS(' ', NULLIF(TRIM(p_first_name), ''), NULLIF(TRIM(p_last_name), '')));
                      IF v_full_name = '' THEN
                        v_full_name := SPLIT_PART(v_norm_email, '@', 1);
                      END IF;

                      v_meta := jsonb_build_object(
                        'first_name', COALESCE(NULLIF(TRIM(p_first_name), ''), SPLIT_PART(v_full_name, ' ', 1)),
                        'last_name', COALESCE(NULLIF(TRIM(p_last_name), ''), ''),
                        'full_name', v_full_name,
                        'phone', COALESCE(NULLIF(TRIM(p_phone), ''), ''),
                        'company_name', COALESCE(NULLIF(TRIM(p_company_name), ''), ''),
                        'is_company', true,
                        'client_type', 'Corporate',
                        'organization_id', p_org_id::text,
                        'corporate_role', COALESCE(NULLIF(TRIM(p_corporate_role), ''), 'booker'),
                        'role', 'client'
                      );

                      v_prefs := jsonb_build_object(
                        'clientType', 'Corporate',
                        'companyName', NULLIF(TRIM(p_company_name), ''),
                        'firstName', NULLIF(TRIM(p_first_name), ''),
                        'lastName', NULLIF(TRIM(p_last_name), ''),
                        'organizationId', p_org_id::text,
                        'corporateRole', COALESCE(NULLIF(TRIM(p_corporate_role), ''), 'booker')
                      ) || COALESCE(p_preferences, '{}'::jsonb);

                      INSERT INTO auth.users (
                        id, instance_id, email, encrypted_password, email_confirmed_at, confirmed_at,
                        raw_app_meta_data, raw_user_meta_data, phone, created_at, updated_at, role, aud
                      ) VALUES (
                        v_new_id, '00000000-0000-0000-0000-000000000000', v_norm_email,
                        crypt(p_password, gen_salt('bf')), NOW(), NOW(),
                        '{"provider":"email","providers":["email"]}'::jsonb,
                        v_meta, NULLIF(TRIM(p_phone), ''), NOW(), NOW(), 'authenticated', 'authenticated'
                      );

                      INSERT INTO public.profiles (
                        id, user_id, email, full_name, phone, phone_number, role, status, permissions, preferences, created_at, updated_at
                      ) VALUES (
                        v_new_id, v_new_id, v_norm_email, v_full_name,
                        NULLIF(TRIM(p_phone), ''), NULLIF(TRIM(p_phone), ''),
                        'client', 'Active', COALESCE(p_permissions, '[]'::jsonb), v_prefs, NOW(), NOW()
                      )
                      ON CONFLICT (id) DO UPDATE SET
                        email = EXCLUDED.email,
                        full_name = EXCLUDED.full_name,
                        phone = EXCLUDED.phone,
                        phone_number = EXCLUDED.phone_number,
                        role = 'client',
                        status = 'Active',
                        permissions = EXCLUDED.permissions,
                        preferences = EXCLUDED.preferences,
                        updated_at = NOW();

                      RETURN jsonb_build_object(
                        'id', v_new_id,
                        'email', v_norm_email,
                        'full_name', v_full_name
                      );
                    END;
                    \$\$;
                    REVOKE ALL ON FUNCTION public.provision_corporate_portal_user(uuid, text, text, text, text, text, text, text, jsonb, jsonb) FROM PUBLIC, anon, authenticated;
                    GRANT EXECUTE ON FUNCTION public.provision_corporate_portal_user(uuid, text, text, text, text, text, text, text, jsonb, jsonb) TO postgres, service_role;

                    CREATE OR REPLACE FUNCTION public.delete_corporate_portal_user(
                      p_user_id uuid,
                      p_org_id uuid
                    )
                    RETURNS jsonb
                    LANGUAGE plpgsql
                    SECURITY DEFINER
                    SET search_path TO public, auth, extensions
                    AS \$\$
                    DECLARE
                      v_prof record;
                    BEGIN
                      IF p_user_id = p_org_id THEN
                        RETURN jsonb_build_object('error', 'Cannot delete the primary Corporate Account Owner.');
                      END IF;
                      SELECT id, preferences INTO v_prof FROM public.profiles WHERE id = p_user_id LIMIT 1;
                      IF v_prof.id IS NULL OR COALESCE(v_prof.preferences->>'organizationId', '') <> p_org_id::text THEN
                        RETURN jsonb_build_object('error', 'User does not belong to this corporate organization.');
                      END IF;
                      DELETE FROM public.profiles WHERE id = p_user_id;
                      DELETE FROM auth.users WHERE id = p_user_id;
                      RETURN jsonb_build_object('deleted', true, 'id', p_user_id);
                    END;
                    \$\$;
                    REVOKE ALL ON FUNCTION public.delete_corporate_portal_user(uuid, uuid) FROM PUBLIC, anon, authenticated;
                    GRANT EXECUTE ON FUNCTION public.delete_corporate_portal_user(uuid, uuid) TO postgres, service_role;

                    CREATE TABLE IF NOT EXISTS public.client_notifications (
                      id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                      user_id uuid NOT NULL,
                      organization_id uuid,
                      category text NOT NULL DEFAULT 'system',
                      severity text NOT NULL DEFAULT 'info',
                      title text NOT NULL,
                      message text NOT NULL,
                      action_url text DEFAULT '/bookings',
                      action_label text DEFAULT 'View Details',
                      is_read boolean NOT NULL DEFAULT false,
                      metadata jsonb NOT NULL DEFAULT '{}'::jsonb,
                      created_at timestamptz NOT NULL DEFAULT now()
                    );
                    CREATE INDEX IF NOT EXISTS idx_client_notifications_user_created ON public.client_notifications(user_id, created_at DESC);
                    CREATE INDEX IF NOT EXISTS idx_client_notifications_org_created ON public.client_notifications(organization_id, created_at DESC);
                    ALTER TABLE public.client_notifications ENABLE ROW LEVEL SECURITY;
                    DROP POLICY IF EXISTS "service_role_full_access_client_notifs" ON public.client_notifications;
                    CREATE POLICY "service_role_full_access_client_notifs" ON public.client_notifications TO service_role USING (true) WITH CHECK (true);
                    DROP POLICY IF EXISTS "users_read_own_client_notifs" ON public.client_notifications;
                    CREATE POLICY "users_read_own_client_notifs" ON public.client_notifications FOR SELECT TO authenticated USING (auth.uid() = user_id);
                    GRANT ALL ON TABLE public.client_notifications TO postgres, service_role;
                    GRANT SELECT, UPDATE ON TABLE public.client_notifications TO authenticated;

                    CREATE OR REPLACE FUNCTION public.fn_notify_client_on_booking_change()
                    RETURNS trigger
                    LANGUAGE plpgsql
                    SECURITY DEFINER
                    SET search_path TO public
                    AS \$\$
                    DECLARE
                      v_org_id uuid;
                      v_ref text;
                      v_route text;
                    BEGIN
                      IF NEW.customer_id IS NULL THEN
                        RETURN NEW;
                      END IF;

                      SELECT NULLIF(preferences->>'organizationId', '')::uuid
                        INTO v_org_id
                        FROM public.profiles
                       WHERE id = NEW.customer_id
                       LIMIT 1;

                      v_ref := COALESCE(NEW.booking_details->>'ref', 'TH-' || UPPER(SUBSTRING(NEW.id::text FROM 1 FOR 6)));
                      v_route := TRIM(CONCAT_WS(' → ', NULLIF(SPLIT_PART(COALESCE(NEW.pickup_address, ''), ',', 1), ''), NULLIF(SPLIT_PART(COALESCE(NEW.dropoff_address, ''), ',', 1), '')));
                      IF v_route = '' THEN
                        v_route := 'Charter Itinerary';
                      END IF;

                      IF TG_OP = 'INSERT' THEN
                        IF LOWER(COALESCE(NEW.status, '')) = 'quotation' THEN
                          INSERT INTO public.client_notifications (user_id, organization_id, category, severity, title, message, action_url, action_label, metadata)
                          VALUES (
                            NEW.customer_id,
                            COALESCE(v_org_id, NEW.customer_id),
                            'quotation',
                            'info',
                            'Quotation Saved (' || v_ref || ')',
                            'Your official rate lock for ' || v_route || ' is ready for review.',
                            '/quotations',
                            'Review Quote',
                            jsonb_build_object('booking_id', NEW.id, 'status', NEW.status)
                          );
                        ELSE
                          INSERT INTO public.client_notifications (user_id, organization_id, category, severity, title, message, action_url, action_label, metadata)
                          VALUES (
                            NEW.customer_id,
                            COALESCE(v_org_id, NEW.customer_id),
                            'booking',
                            'success',
                            'Booking Confirmed (' || v_ref || ')',
                            'Your reservation for ' || v_route || ' has been received by dispatch.',
                            '/bookings',
                            'Track Booking',
                            jsonb_build_object('booking_id', NEW.id, 'status', NEW.status)
                          );
                        END IF;
                      ELSIF TG_OP = 'UPDATE' AND COALESCE(OLD.status, '') IS DISTINCT FROM COALESCE(NEW.status, '') THEN
                        INSERT INTO public.client_notifications (user_id, organization_id, category, severity, title, message, action_url, action_label, metadata)
                        VALUES (
                          NEW.customer_id,
                          COALESCE(v_org_id, NEW.customer_id),
                          CASE WHEN LOWER(COALESCE(NEW.status, '')) = 'quotation' THEN 'quotation' ELSE 'dispatch' END,
                          CASE WHEN LOWER(COALESCE(NEW.status, '')) = 'cancelled' THEN 'warning' ELSE 'success' END,
                          'Trip Status Updated: ' || INITCAP(REPLACE(COALESCE(NEW.status, 'updated'), '_', ' ')),
                          'Reference ' || v_ref || ' (' || v_route || ') is now ' || REPLACE(COALESCE(NEW.status, 'updated'), '_', ' ') || '.',
                          '/bookings',
                          'View Trip',
                          jsonb_build_object('booking_id', NEW.id, 'status', NEW.status)
                        );
                      END IF;

                      RETURN NEW;
                    EXCEPTION WHEN OTHERS THEN
                      RETURN NEW;
                    END;
                    \$\$;

                    DROP TRIGGER IF EXISTS trg_bookings_client_notification ON public.bookings;
                    CREATE TRIGGER trg_bookings_client_notification
                      AFTER INSERT OR UPDATE ON public.bookings
                      FOR EACH ROW
                      EXECUTE FUNCTION public.fn_notify_client_on_booking_change();

                    NOTIFY pgrst, 'reload schema';
                  "
                  ) > /tmp/poststart.log 2>&1 &
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: supabase-db-pvc-v4
      - name: init-sql
        configMap:
          name: supabase-init-sql
