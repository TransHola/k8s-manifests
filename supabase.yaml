apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: supabase-db-pvc-v3
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-db
  namespace: default
  labels:
    app: supabase-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase-db
  template:
    metadata:
      annotations:
        rollout: "v3-init-rpcs"
      labels:
        app: supabase-db
    spec:
      containers:
      - name: postgres
        image: postgis/postgis:16-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_DB
          value: "postgres"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: supabase-db-pvc-v3
      - name: init-sql
        configMap:
          name: supabase-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-db
  namespace: default
spec:
  selector:
    app: supabase-db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-rest
  namespace: default
  labels:
    app: supabase-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase-rest
  template:
    metadata:
      annotations:
        rollout: "v3-init-rpcs"
      labels:
        app: supabase-rest
    spec:
      containers:
      - name: postgrest
        image: postgrest/postgrest:v12.2.0
        env:
        - name: PGRST_DB_URI
          value: "postgresql://postgres:postgres@supabase-db:5432/postgres"
        - name: PGRST_DB_SCHEMAS
          value: "public"
        - name: PGRST_DB_ANON_ROLE
          value: "postgres"
        - name: PGRST_JWT_SECRET
          value: "super-secret-jwt-token-with-at-least-32-characters-long"
        - name: PGRST_SERVER_PORT
          value: "3000"
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-rest
  namespace: default
spec:
  selector:
    app: supabase-rest
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-kong-nginx
  namespace: default
data:
  default.conf: |
    server {
        listen 8000;
        
        gzip on;
        gzip_types application/json text/plain;

        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        location /rest/v1/ {
            proxy_pass http://supabase-rest:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location / {
            return 200 '{"status":"ok","service":"transhola-supabase-gateway"}';
            add_header Content-Type application/json;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-kong
  namespace: default
  labels:
    app: supabase-kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase-kong
  template:
    metadata:
      labels:
        app: supabase-kong
    spec:
      containers:
      - name: gateway
        image: nginx:alpine
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "20m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: nginx-config
        configMap:
          name: supabase-kong-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-kong
  namespace: default
spec:
  selector:
    app: supabase-kong
  ports:
  - port: 8000
    targetPort: 8000
