---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-kong
  namespace: default
  labels:
    app: supabase-kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase-kong
  template:
    metadata:
      annotations:
        rollout: "v9-direct-200-rpc-return"
      labels:
        app: supabase-kong
    spec:
      containers:
      - name: gateway
        image: nginx:alpine
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "20m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: nginx-config
        configMap:
          name: supabase-kong-nginx-v9
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-kong
  namespace: default
spec:
  selector:
    app: supabase-kong
  ports:
  - port: 8000
    targetPort: 8000
