":"Cadillac","model":"Escalade ESV","license_plate":"DC-9920","status":"Active"},{"id":"5538476e-dd31-4647-bcec-51c55a032934","company_id":"0a278d83-7497-4c0a-b587-0880f5520310","name":"2024 Cadillac Escalade ESV #01","make":"Cadillac","model":"Escalade ESV","license_plate":"DC-8849","status":"Active"}]';
