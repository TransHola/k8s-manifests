---
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-kong-nginx-v12
  namespace: default
data:
  default.conf: |
    server {
        listen 8000;
        client_max_body_size 50m;
        client_body_buffer_size 10m;
        
        gzip on;
        gzip_types application/json text/plain;

        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        location /auth/v1/ {
            proxy_pass http://supabase-auth:9999/auth/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /rest/v1/ {
            proxy_pass http://supabase-rest:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location / {
            return 200 '{"status":"ok","service":"transhola-supabase-gateway"}';
            add_header Content-Type application/json;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-kong
  namespace: default
  labels:
    app: supabase-kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase-kong
  template:
    metadata:
      annotations:
        rollout: "v12-live-postgres-auth-and-rest-gateway"
      labels:
        app: supabase-kong
    spec:
      containers:
      - name: gateway
        image: nginx:alpine
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "20m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: nginx-config
        configMap:
          name: supabase-kong-nginx-v12
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-kong
  namespace: default
spec:
  selector:
    app: supabase-kong
  ports:
  - port: 8000
    targetPort: 8000
