apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: supabase-db-pvc-v4
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-db
  namespace: default
  labels:
    app: supabase-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase-db
  template:
    metadata:
      annotations:
        rollout: "v5-align-superadmin-credentials-2026"
      labels:
        app: supabase-db
    spec:
      containers:
      - name: postgres
        image: postgis/postgis:16-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_DB
          value: "postgres"
        ports:
        - containerPort: 5432
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  (until pg_isready -h localhost -p 5432 -U postgres -d postgres; do sleep 1; done
                  psql -h localhost -p 5432 -U postgres -d postgres -c "
                    ALTER TABLE public.company_profiles ADD COLUMN IF NOT EXISTS risk_level VARCHAR(255) DEFAULT 'Unknown';
                    ALTER TABLE public.company_profiles ADD COLUMN IF NOT EXISTS risk_factors JSONB DEFAULT '[]'::jsonb;

                    DROP FUNCTION IF EXISTS public.admin_get_all_companies() CASCADE;
                    CREATE OR REPLACE FUNCTION public.admin_get_all_companies()
                    RETURNS SETOF public.company_profiles
                    LANGUAGE sql STABLE SECURITY DEFINER
                    AS \$\$ SELECT * FROM public.company_profiles ORDER BY created_at DESC; \$\$;

                    DROP FUNCTION IF EXISTS public.admin_get_all_vehicles() CASCADE;
                    CREATE OR REPLACE FUNCTION public.admin_get_all_vehicles()
                    RETURNS SETOF public.vehicles
                    LANGUAGE sql STABLE SECURITY DEFINER
                    AS \$\$ SELECT * FROM public.vehicles ORDER BY created_at DESC; \$\$;

                    GRANT USAGE ON SCHEMA public TO postgres, anon, authenticated, service_role;
                    GRANT ALL ON ALL TABLES IN SCHEMA public TO postgres, anon, authenticated, service_role;
                    GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO postgres, anon, authenticated, service_role;
                    GRANT EXECUTE ON FUNCTION public.admin_get_all_companies() TO postgres, anon, authenticated, service_role;
                    GRANT EXECUTE ON FUNCTION public.admin_get_all_vehicles() TO postgres, anon, authenticated, service_role;

                    -- Synchronize SuperAdmin Root Master Credentials (TransHola2026!)
                    UPDATE auth.users 
                    SET encrypted_password = '$2a$10$26HuDSQaI.ArAWnZsJ3pnONhJYQEuCWYyBqGZEFmw9Eidq27lOdrC',
                        email_confirmed_at = COALESCE(email_confirmed_at, NOW()),
                        updated_at = NOW()
                    WHERE email = 'admin@transhola.com';

                    INSERT INTO auth.users (
                      id, instance_id, email, encrypted_password, email_confirmed_at, 
                      raw_app_meta_data, raw_user_meta_data, created_at, updated_at, role, aud
                    )
                    SELECT 
                      '2557bace-be05-466c-a68a-2b6190fd6389', '00000000-0000-0000-0000-000000000000',
                      'admin@transhola.com', '$2a$10$26HuDSQaI.ArAWnZsJ3pnONhJYQEuCWYyBqGZEFmw9Eidq27lOdrC',
                      NOW(), '{"provider":"email","providers":["email"]}', 
                      '{"role":"super_admin","full_name":"Fathallah Lahlou"}', 
                      NOW(), NOW(), 'authenticated', 'authenticated'
                    WHERE NOT EXISTS (SELECT 1 FROM auth.users WHERE email = 'admin@transhola.com');

                    INSERT INTO public.profiles (id, email, full_name, role, status)
                    VALUES ('2557bace-be05-466c-a68a-2b6190fd6389', 'admin@transhola.com', 'Fathallah Lahlou', 'superadmin', 'Active')
                    ON CONFLICT (id) DO UPDATE SET role = 'superadmin', status = 'Active';

                    INSERT INTO public.staff_profiles (id, email, full_name, role, status)
                    VALUES ('2557bace-be05-466c-a68a-2b6190fd6389', 'admin@transhola.com', 'TransHola SuperAdmin', 'owner', 'active')
                    ON CONFLICT (id) DO UPDATE SET role = 'owner', status = 'active';

                    NOTIFY pgrst, 'reload schema';
                  "
                  ) > /tmp/poststart.log 2>&1 &
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: supabase-db-pvc-v4
      - name: init-sql
        configMap:
          name: supabase-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-db
  namespace: default
spec:
  selector:
    app: supabase-db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-rest
  namespace: default
  labels:
    app: supabase-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase-rest
  template:
    metadata:
      annotations:
        rollout: "v4-clean-db-with-rpcs"
      labels:
        app: supabase-rest
    spec:
      containers:
      - name: postgrest
        image: postgrest/postgrest:v12.2.0
        env:
        - name: PGRST_DB_URI
          value: "postgresql://postgres:postgres@supabase-db:5432/postgres"
        - name: PGRST_DB_SCHEMAS
          value: "public"
        - name: PGRST_DB_ANON_ROLE
          value: "postgres"
        - name: PGRST_JWT_SECRET
          value: "super-secret-jwt-token-with-at-least-32-characters-long"
        - name: PGRST_SERVER_PORT
          value: "3000"
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-rest
  namespace: default
spec:
  selector:
    app: supabase-rest
  ports:
  - port: 3000
    targetPort: 3000
---
