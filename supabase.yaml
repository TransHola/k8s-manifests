apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: supabase-db-pvc-v4
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-db
  namespace: default
  labels:
    app: supabase-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase-db
  template:
    metadata:
      annotations:
        rollout: "v4-clean-db-with-rpcs"
      labels:
        app: supabase-db
    spec:
      containers:
      - name: postgres
        image: postgis/postgis:16-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_DB
          value: "postgres"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: supabase-db-pvc-v4
      - name: init-sql
        configMap:
          name: supabase-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-db
  namespace: default
spec:
  selector:
    app: supabase-db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-rest
  namespace: default
  labels:
    app: supabase-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase-rest
  template:
    metadata:
      annotations:
        rollout: "v4-clean-db-with-rpcs"
      labels:
        app: supabase-rest
    spec:
      containers:
      - name: postgrest
        image: postgrest/postgrest:v12.2.0
        env:
        - name: PGRST_DB_URI
          value: "postgresql://postgres:postgres@supabase-db:5432/postgres"
        - name: PGRST_DB_SCHEMAS
          value: "public"
        - name: PGRST_DB_ANON_ROLE
          value: "postgres"
        - name: PGRST_JWT_SECRET
          value: "super-secret-jwt-token-with-at-least-32-characters-long"
        - name: PGRST_SERVER_PORT
          value: "3000"
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-rest
  namespace: default
spec:
  selector:
    app: supabase-rest
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-kong-nginx
  namespace: default
data:
  default.conf: |
    server {
        listen 8000;
        
        gzip on;
        gzip_types application/json text/plain;

        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        location /rest/v1/ {
            proxy_pass http://supabase-rest:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location / {
            return 200 '{"status":"ok","service":"transhola-supabase-gateway"}';
            add_header Content-Type application/json;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-kong
  namespace: default
  labels:
    app: supabase-kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase-kong
  template:
    metadata:
      labels:
        app: supabase-kong
    spec:
      containers:
      - name: gateway
        image: nginx:alpine
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "20m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: nginx-config
        configMap:
          name: supabase-kong-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-kong
  namespace: default
spec:
  selector:
    app: supabase-kong
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: supabase-migration-v3
  namespace: default
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrator
        image: postgis/postgis:16-alpine
        env:
        - name: PGPASSWORD
          value: "postgres"
        command:
        - /bin/sh
        - -c
        - |
          until pg_isready -h supabase-db -p 5432 -U postgres -d postgres; do
            echo "Waiting for postgres..."
            sleep 2
          done
          echo "Connected to postgres! Applying schema and data from init.sql..."
          psql -h supabase-db -p 5432 -U postgres -d postgres -f /scripts/init.sql || true
          echo "Applying RPC functions directly..."
          psql -h supabase-db -p 5432 -U postgres -d postgres -c "
            CREATE OR REPLACE FUNCTION public.admin_get_all_companies()
            RETURNS SETOF public.company_profiles
            LANGUAGE sql
            STABLE
            SECURITY DEFINER
            AS \$\$ SELECT * FROM public.company_profiles ORDER BY created_at DESC; \$\$;

            CREATE OR REPLACE FUNCTION public.admin_get_all_vehicles()
            RETURNS SETOF public.vehicles
            LANGUAGE sql
            STABLE
            SECURITY DEFINER
            AS \$\$ SELECT * FROM public.vehicles ORDER BY created_at DESC; \$\$;

            GRANT USAGE ON SCHEMA public TO postgres, anon, authenticated, service_role;
            GRANT ALL ON ALL TABLES IN SCHEMA public TO postgres, anon, authenticated, service_role;
            GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO postgres, anon, authenticated, service_role;
            GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO postgres, anon, authenticated, service_role;
            GRANT EXECUTE ON FUNCTION public.admin_get_all_companies() TO postgres, anon, authenticated, service_role;
            GRANT EXECUTE ON FUNCTION public.admin_get_all_vehicles() TO postgres, anon, authenticated, service_role;
            NOTIFY pgrst, 'reload schema';
          "
          echo "Schema migration and NOTIFY pgrst successful!"
        volumeMounts:
        - name: init-sql
          mountPath: /scripts
      volumes:
      - name: init-sql
        configMap:
          name: supabase-init-sql
